<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #dfd3ee; color: #1e1830; padding-bottom: 72px; }
    .topbar {
      background: #5c1b8a; color: #fff; padding: 11px 14px;
      display: flex; justify-content: space-between; align-items: center; font-weight: 800;
    }
    .pill {
      background: rgba(255,255,255,0.18); padding: 5px 11px;
      border-radius: 999px; font-size: 12px; font-weight: 800;
    }
    .container { padding: 10px; max-width: 560px; margin: 0 auto; }

    .lobby-card {
      background: #efe8f8; border: 1px solid #c9b7e3;
      border-radius: 14px; padding: 12px; margin-bottom: 12px;
    }
    .lobby-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 8px; }
    .stakes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stake-btn {
      padding: 10px 6px; border-radius: 10px; border: 2px solid #5c1b8a;
      background: #fff; color: #1e1830; font-weight: 800; cursor: pointer;
    }
    .stake-btn.active { background: #5c1b8a; color: #fff; }
    .countdown-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #5c1b8a; color: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
      font-weight: 800;
    }
    .grid-300 {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
      max-height: 230px; overflow-y: auto; padding: 6px; background: #ddd0ef; border-radius: 10px;
    }
    .num-btn {
      padding: 7px 2px; border: 1px solid #b9a6d6; border-radius: 6px;
      background: #faf6ff; color: #1e1830; font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .num-btn.mine { background: #16a34a; color: #fff; border-color: #16a34a; }
    .num-btn.ai { background: #6b21a8; color: #fff; border-color: #6b21a8; cursor: not-allowed; }
    .num-btn.taken { background: #9b8eb3; color: #f3effa; cursor: not-allowed; }
    .start-main-btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: #d97706; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
    }

    .stats-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
    .stat-box {
      background: #f5effc; border: 1px solid #c6b4e0; border-radius: 8px;
      padding: 6px 4px; text-align: center;
    }
    .stat-lbl { font-size: 10px; font-weight: 700; color: #4a3f6b; }
    .stat-val { font-size: 11px; font-weight: 900; color: #1e1830; margin-top: 2px; }

    .arena-split { display: grid; grid-template-columns: 148px 1fr; gap: 10px; align-items: start; }
    .board75-card { background: #efe8f8; border: 1px solid #c5b2e0; border-radius: 12px; padding: 6px; }
    .b75-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 4px; }
    .b75-h { text-align: center; font-size: 11px; font-weight: 900; color: #fff; padding: 4px 0; border-radius: 5px; }
    .h-B { background: #eab308; }
    .h-I { background: #16a34a; }
    .h-N { background: #2563eb; }
    .h-G { background: #ea580c; }
    .h-O { background: #9333ea; }
    .b75-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
    .b75-cell {
      font-size: 10px; font-weight: 800; text-align: center; padding: 5px 0;
      border-radius: 4px; background: #d6c8eb; color: #5b507a;
    }
    .b75-cell.called { background: #ea580c; color: #fff; }
    .b75-cell.latest { background: #16a34a; color: #fff; }

    .right-panel { display: flex; flex-direction: column; gap: 8px; }
    .current-call-bar {
      background: #6b1d9b; color: #fff; border-radius: 12px;
      padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-size: 16px;
    }
    .call-badge-pill { background: #ea580c; color: #fff; padding: 5px 12px; border-radius: 999px; font-size: 15px; font-weight: 900; }
    .recent-calls-box {
      background: #ede4f7; border: 1px solid #c5b2e0; border-radius: 12px;
      padding: 8px; display: flex; justify-content: center; gap: 8px; min-height: 52px; align-items: center;
    }
    .rec-orb {
      width: 44px; height: 44px; border-radius: 999px; display: flex;
      align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff;
    }
    .rec-0 { background: #7e22ce; }
    .rec-1 { background: #dc2626; }
    .rec-2 { background: #2563eb; }

    .controls-strip {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      background: #f5effc; border: 1px solid #c6b4e0; border-radius: 10px;
      padding: 7px 10px; font-size: 12px; font-weight: 800;
    }
    .mini-ctrl-btn {
      background: #e2d5f5; border: none; border-radius: 8px;
      padding: 5px 9px; font-weight: 800; font-size: 12px; cursor: pointer; color: #1e1830;
    }
    .auto-toggle {
      background: #f3e8ff; border: 1px solid #c084fc; border-radius: 999px;
      padding: 3px 9px; font-size: 11px; font-weight: 900; color: #6b21a8; cursor: pointer;
    }
    .auto-toggle.on { background: #16a34a; border-color: #16a34a; color: #fff; }

    .player-area-card { background: #dfd3ee; border: 1px solid #c2aee0; border-radius: 12px; padding: 10px; min-height: 210px; }
    .my-cartela-box { background: #f7f2fc; border: 1px solid #c2aee0; border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .my-cartela-title { display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; color: #5c1b8a; margin-bottom: 6px; }
    .c5-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .c5-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; background: #e8def7; font-weight: 900; font-size: 12px;
      border: 1px solid #c3b0e0; cursor: pointer; user-select: none;
    }
    .c5-cell.marked { background: #ea580c; color: #fff; border-color: #ea580c; }
    .c5-cell.free { background: #16a34a; color: #fff; border-color: #16a34a; }
    .c5-cell.win-line { background: #2563eb; color: #fff; border-color: #2563eb; }

    .ai-mini-bar {
      background: #f3ecfc; border: 1px solid #c5b2e0; border-radius: 10px;
      padding: 7px 10px; font-size: 12px; font-weight: 800;
      display: flex; justify-content: space-between; color: #3b2868;
    }

    .bottom-actions {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #efe7f8; border-top: 1px solid #c4b0e0;
      display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 8px; padding: 8px 10px;
    }
    .act-leave { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 10px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .act-refresh { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .act-bingo { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 10px; font-weight: 900; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>Trust Bingo</span>
    <span class="pill" id="balPill">Balance: 100.00 ብር</span>
  </div>

  <div class="container">
    <div id="lobbyView">
      <div class="countdown-box">
        <div>
          <div style="font-size:13px;">Match Countdown</div>
          <div style="font-size:11px;opacity:0.88;">ካርቴላ ስትይዝ ጊዜ ይቆጠራል • Solo vs AI</div>
        </div>
        <div style="font-size:20px;" id="countdownText">10s</div>
      </div>

      <div class="lobby-card">
        <div class="lobby-head">
          <span>1. Stake ምረጥ</span>
          <span id="lobbyDerash">ደራሽ፦ 0 ብር</span>
        </div>
        <div class="stakes">
          <button class="stake-btn active" data-stake="10">10 ብር</button>
          <button class="stake-btn" data-stake="20">20 ብር</button>
          <button class="stake-btn" data-stake="50">50 ብር</button>
        </div>
      </div>

      <div class="lobby-card">
        <div class="lobby-head">
          <span>2. ካርቴላ ምረጥ (#1 - #300)</span>
          <span id="pickedCount">0 ተመርጧል</span>
        </div>
        <div class="grid-300" id="cartelaGrid"></div>
      </div>

      <button class="start-main-btn" id="startGameBtn">ጨዋታ ጀምር (Play)</button>
    </div>

    <div id="gameView" style="display:none;">
      <div class="stats-strip">
        <div class="stat-box"><div class="stat-lbl">Game ID</div><div class="stat-val" id="stGameId">-</div></div>
        <div class="stat-box"><div class="stat-lbl">Derash</div><div class="stat-val" id="stDerash">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Players</div><div class="stat-val" id="stPlayers">2</div></div>
        <div class="stat-box"><div class="stat-lbl">Stake</div><div class="stat-val" id="stStake">10</div></div>
        <div class="stat-box"><div class="stat-lbl">Called</div><div class="stat-val" id="stCalled">0/75</div></div>
      </div>

      <div class="arena-split">
        <div class="board75-card">
          <div class="b75-header">
            <div class="b75-h h-B">B</div>
            <div class="b75-h h-I">I</div>
            <div class="b75-h h-N">N</div>
            <div class="b75-h h-G">G</div>
            <div class="b75-h h-O">O</div>
          </div>
          <div class="b75-grid" id="board75Grid"></div>
        </div>

        <div class="right-panel">
          <div class="current-call-bar">
            <span>Current Call</span>
            <span class="call-badge-pill" id="currentCallPill">-</span>
          </div>

          <div class="recent-calls-box" id="recentCallsBox"></div>

          <div class="controls-strip">
            <button class="mini-ctrl-btn" id="soundToggleBtn">🔊 Sound</button>
            <span id="cartelaBadgeText">Cartela #0</span>
            <button class="auto-toggle" id="autoMarkBtn">Auto OFF</button>
          </div>

          <div class="player-area-card" id="playerAreaCard">
            <div id="myBoardsList"></div>
          </div>

          <div class="ai-mini-bar">
            <span>🤖 AI (#<span id="aiIdText">-</span>)</span>
            <span id="aiLineText">Line: 1/5</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-actions" id="bottomBar" style="display:none;">
    <button class="act-leave" id="leaveBtn">⬅ Leave</button>
    <button class="act-refresh" id="refreshBtn">↻ Refresh</button>
    <button class="act-bingo" id="bingoBtn">Bingo!</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(window.location.search);
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    const userId = String(tgUser || params.get('userId') || 'guest');

    let currentBalance = 100;
    let currentStake = 10;
    let myCartelas = [];
    let takenCartelas = [];
    let aiCartelaId = null;
    let aiCard = null;
    let aiMarked = new Set(['FREE']);

    let gameId = '';
    let drawOrder = [];
    let calledSet = new Set();
    let latestNum = null;
    let drawPos = 0;
    let recentCalls = [];
    let currentDerash = 0;
    let activeBoards = [];
    let gameEnded = false;

    let soundOn = true;
    let autoMarkOn = false;
    let autoCallTimer = null;
    let countdownSec = 10;
    let countdownTimer = null;

    function showAlert(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    function setBalance(val) {
      currentBalance = Number(val);
      if (!Number.isFinite(currentBalance)) currentBalance = 100;
      document.getElementById('balPill').textContent = 'Balance: ' + currentBalance.toFixed(2) + ' ብር';
    }

    function letterFor(num) {
      if (num <= 15) return 'B';
      if (num <= 30) return 'I';
      if (num <= 45) return 'N';
      if (num <= 60) return 'G';
      return 'O';
    }

    function speak(text) {
      if (!soundOn) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1.05;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    function stopCountdown() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    function startCountdown() {
      stopCountdown();
      countdownSec = 10;
      document.getElementById('countdownText').textContent = countdownSec + 's';
      countdownTimer = setInterval(async () => {
        if (myCartelas.length === 0) {
          countdownSec = 10;
          document.getElementById('countdownText').textContent = '10s';
          return;
        }
        countdownSec -= 1;
        document.getElementById('countdownText').textContent = Math.max(0, countdownSec) + 's';
        if (countdownSec <= 0) {
          stopCountdown();
          await startGame();
        }
      }, 1000);
    }

    function stopAutoLoop() {
      if (autoCallTimer) { clearInterval(autoCallTimer); autoCallTimer = null; }
    }

    function syncAutoMarkOnBoards() {
      if (!autoMarkOn) return;
      activeBoards.forEach((b) => {
        (b._cells || []).forEach((cell) => {
          const n = Number(cell.dataset.num);
          if (Number.isFinite(n) && calledSet.has(n)) {
            cell.classList.add('marked');
          }
        });
      });
    }

    function renderGrid300() {
      const grid = document.getElementById('cartelaGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 300; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = i;
        if (myCartelas.includes(i)) {
          btn.classList.add('mine');
        } else if (i === aiCartelaId) {
          btn.classList.add('ai');
          btn.disabled = true;
        } else if (takenCartelas.includes(i)) {
          btn.classList.add('taken');
          btn.disabled = true;
        }
        btn.addEventListener('click', () => takeCartela(i));
        grid.appendChild(btn);
      }
    }

    async function loadLobby() {
      document.getElementById('pickedCount').textContent = myCartelas.length + ' ተመርጧል';
      const estDerash = Math.round((myCartelas.length + 1) * currentStake * 0.8);
      document.getElementById('lobbyDerash').textContent = 'ደራሽ፦ ' + estDerash + ' ብር';
      renderGrid300();

      try {
        const res = await fetch('/api/state?userId=' + encodeURIComponent(userId) + '&stake=' + currentStake);
        if (res.ok) {
          const data = await res.json();
          if (typeof data.balance === 'number') setBalance(data.balance);
          if (data.room && Array.isArray(data.room.takenCartelas)) {
            takenCartelas = data.room.takenCartelas;
          }
          if (data.room && typeof data.room.derash === 'number' && data.room.derash > 0) {
            document.getElementById('lobbyDerash').textContent = 'ደራሽ፦ ' + data.room.derash + ' ብር';
          }
          renderGrid300();
        }
      } catch (e) {}
    }

    async function takeCartela(id) {
      if (myCartelas.includes(id)) return;
      if (currentBalance < currentStake) {
        return showAlert('ባላንስ በቂ አይደለም።');
      }

      let serverOk = false;
      try {
        const res = await fetch('/api/take-cartela', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, stake: currentStake, cartelaId: id })
        });
        const data = await res.json();
        if (res.ok) {
          serverOk = true;
          if (typeof data.balance === 'number') setBalance(data.balance);
          if (data.room && Array.isArray(data.room.takenCartelas)) {
            takenCartelas = data.room.takenCartelas;
          }
        }
      } catch (e) {}

      if (!serverOk) {
        setBalance(currentBalance - currentStake);
      }

      myCartelas.push(id);
      if (!aiCartelaId) {
        let cand = ((id * 29 + 13) % 300) + 1;
        if (myCartelas.includes(cand)) cand = (cand % 300) + 1;
        aiCartelaId = cand;
      }

      await loadLobby();
      startCountdown();
    }

    function buildCartelaGrid(id) {
      const ranges = [[1, 15], [16, 30], [31, 45], [46, 60], [61, 75]];
      let s = (id * 7919 + 104729) % 2147483647;
      const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      const cols = ranges.map(([lo, hi]) => {
        const arr = [];
        for (let n = lo; n <= hi; n++) arr.push(n);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.slice(0, 5);
      });
      const card = [];
      for (let r = 0; r < 5; r++) {
        const row = [];
        for (let c = 0; c < 5; c++) row.push(r === 2 && c === 2 ? 'FREE' : cols[c][r]);
        card.push(row);
      }
      return card;
    }

    function makeShuffled75() {
      const arr = [];
      for (let i = 1; i <= 75; i++) arr.push(i);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function findWinningIndices(card, markedSet) {
      const lines = [];
      for (let r = 0; r < 5; r++) lines.push([0,1,2,3,4].map((c) => [r, c]));
      for (let c = 0; c < 5; c++) lines.push([0,1,2,3,4].map((r) => [r, c]));
      lines.push([0,1,2,3,4].map((i) => [i, i]));
      lines.push([0,1,2,3,4].map((i) => [i, 4 - i]));
      for (const line of lines) {
        if (line.every(([r, c]) => markedSet.has(String(card[r][c])))) return line;
      }
      return null;
    }

    function checkPlayerWinAndHighlight() {
      for (const b of activeBoards) {
        const card = b.card || [];
        const marked = new Set(['FREE']);
        const cells = b._cells || [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const val = card[r][c];
            if (val === 'FREE') continue;
            const el = cells[r * 5 + c];
            if (el && el.classList.contains('marked') && calledSet.has(Number(val))) {
              marked.add(String(val));
            }
          }
        }
        const winLine = findWinningIndices(card, marked);
        if (winLine) {
          winLine.forEach(([r, c]) => {
            if (cells[r * 5 + c]) cells[r * 5 + c].classList.add('win-line');
          });
          return true;
        }
      }
      return false;
    }

    function stepAi(num) {
      if (!aiCard || gameEnded) return;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (aiCard[r][c] === num) aiMarked.add(String(num));
        }
      }
      let best = 0;
      for (let r = 0; r < 5; r++) {
        const cnt = [0,1,2,3,4].filter((c) => aiMarked.has(String(aiCard[r][c]))).length;
        if (cnt > best) best = cnt;
      }
      for (let c = 0; c < 5; c++) {
        const cnt = [0,1,2,3,4].filter((r) => aiMarked.has(String(aiCard[r][c]))).length;
        if (cnt > best) best = cnt;
      }
      document.getElementById('aiLineText').textContent = best === 4 ? '1 AWAY! 🔥' : 'Line: ' + best + '/5';

      if (findWinningIndices(aiCard, aiMarked)) {
        gameEnded = true;
        stopAutoLoop();
        speak('AI wins Bingo');
        showAlert('🤖 AI ቀድሞ BINGO አሸነፈ! እንደገና ለመጫወት Leave ብለህ ሞክር።');
      }
    }

    function renderBoard75() {
      const grid = document.getElementById('board75Grid');
      grid.innerHTML = '';
      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 5; col++) {
          const n = col * 15 + row + 1;
          const div = document.createElement('div');
          div.className = 'b75-cell';
          div.textContent = n;
          if (n === latestNum) div.classList.add('latest');
          else if (calledSet.has(n)) div.classList.add('called');
          grid.appendChild(div);
        }
      }
    }

    function renderRecentCalls() {
      const box = document.getElementById('recentCallsBox');
      box.innerHTML = '';
      recentCalls.slice(0, 3).forEach((item, idx) => {
        const orb = document.createElement('div');
        orb.className = 'rec-orb rec-' + (idx % 3);
        orb.textContent = item.replace('-', '');
        box.appendChild(orb);
      });
    }

    function renderMyBoards() {
      const list = document.getElementById('myBoardsList');
      list.innerHTML = '';
      document.getElementById('cartelaBadgeText').textContent =
        currentStake + ' № ' + activeBoards.map((x) => x.id).join(',');

      activeBoards.forEach((b) => {
        const box = document.createElement('div');
        box.className = 'my-cartela-box';
        box.innerHTML = '<div class="my-cartela-title"><span>Cartela #' + b.id + '</span><span>5 in Row</span></div>';

        const grid = document.createElement('div');
        grid.className = 'c5-grid';
        b._cells = [];

        (b.card || []).forEach((row) => {
          row.forEach((val) => {
            const cell = document.createElement('div');
            cell.className = 'c5-cell';
            cell.dataset.num = String(val);
            cell.textContent = val;
            if (val === 'FREE') {
              cell.classList.add('free', 'marked');
            } else {
              if (autoMarkOn && calledSet.has(Number(val))) {
                cell.classList.add('marked');
              }
              cell.addEventListener('click', () => {
                if (autoMarkOn) {
                  return showAlert('Auto ON ሲሆን ቁጥሮች በራሳቸው ይሰመራሉ። በእጅ ለመንካት Auto OFF አድርግ።');
                }
                if (!calledSet.has(Number(val))) {
                  return showAlert('ቁጥር ' + val + ' ገና አልተጠራም።');
                }
                cell.classList.toggle('marked');
              });
            }
            b._cells.push(cell);
            grid.appendChild(cell);
          });
        });

        box.appendChild(grid);
        list.appendChild(box);
      });
    }

    function drawOneCall() {
      if (gameEnded) return;
      if (drawPos >= drawOrder.length) {
        stopAutoLoop();
        return;
      }
      const num = drawOrder[drawPos++];
      latestNum = num;
      calledSet.add(num);
      const code = letterFor(num) + '-' + num;
      recentCalls.unshift(code);

      document.getElementById('currentCallPill').textContent = code;
      document.getElementById('stCalled').textContent = drawPos + '/75';
      renderBoard75();
      renderRecentCalls();

      if (autoMarkOn) {
        activeBoards.forEach((b) => {
          (b._cells || []).forEach((cell) => {
            if (Number(cell.dataset.num) === num) cell.classList.add('marked');
          });
        });
      }

      speak(letterFor(num) + ' ' + num);
      stepAi(num);
    }

    async function startGame() {
      if (myCartelas.length === 0) return showAlert('መጀመሪያ ቢያንስ አንድ ካርቴላ ያዝ።');
      stopCountdown();

      const pickedIds = [...myCartelas];
      let serverData = null;
      try {
        const res = await fetch('/api/start-game', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, stake: currentStake, cartelaIds: pickedIds })
        });
        if (res.ok) serverData = await res.json();
      } catch (e) {}

      gameId = String(Date.now()).slice(-7) + '_TB';
      drawOrder = (serverData && Array.isArray(serverData.drawOrder) && serverData.drawOrder.length)
        ? serverData.drawOrder
        : makeShuffled75();
      calledSet = new Set();
      latestNum = null;
      drawPos = 0;
      recentCalls = [];
      gameEnded = false;

      currentDerash = (serverData && typeof serverData.derash === 'number' && serverData.derash > 0)
        ? serverData.derash
        : Math.round((pickedIds.length + 1) * currentStake * 0.8);

      activeBoards = (serverData && Array.isArray(serverData.boards) && serverData.boards.length)
        ? serverData.boards
        : pickedIds.map((id) => ({ id, card: buildCartelaGrid(id) }));

      myCartelas = [];

      const chosenAi = aiCartelaId || 55;
      aiCard = buildCartelaGrid(chosenAi);
      aiMarked = new Set(['FREE']);
      document.getElementById('aiIdText').textContent = chosenAi;
      document.getElementById('aiLineText').textContent = 'Line: 1/5';

      document.getElementById('stGameId').textContent = gameId;
      document.getElementById('stDerash').textContent = currentDerash;
      document.getElementById('stPlayers').textContent = '2';
      document.getElementById('stStake').textContent = currentStake;
      document.getElementById('stCalled').textContent = '0/75';
      document.getElementById('currentCallPill').textContent = '-';

      renderBoard75();
      renderRecentCalls();
      renderMyBoards();

      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').style.display = 'block';
      document.getElementById('bottomBar').style.display = 'grid';

      stopAutoLoop();
      drawOneCall();
      autoCallTimer = setInterval(() => {
        if (gameEnded || drawPos >= drawOrder.length) stopAutoLoop();
        else drawOneCall();
      }, 2500);
    }

    document.querySelectorAll('.stake-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (myCartelas.length > 0) return showAlert('በዚህ ዙር የተያዘ ካርቴላ አለህ።');
        document.querySelectorAll('.stake-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentStake = Number(btn.dataset.stake);
        await loadLobby();
      });
    });

    document.getElementById('startGameBtn').addEventListener('click', startGame);

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      soundOn = !soundOn;
      document.getElementById('soundToggleBtn').textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
    });

    document.getElementById('autoMarkBtn').addEventListener('click', () => {
      autoMarkOn = !autoMarkOn;
      const btn = document.getElementById('autoMarkBtn');
      btn.textContent = autoMarkOn ? 'Auto ON' : 'Auto OFF';
      btn.classList.toggle('on', autoMarkOn);
      if (autoMarkOn) syncAutoMarkOnBoards();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      renderBoard75();
      renderRecentCalls();
      if (autoMarkOn) syncAutoMarkOnBoards();
    });

    document.getElementById('leaveBtn').addEventListener('click', async () => {
      stopAutoLoop();
      stopCountdown();
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('bottomBar').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'block';
      await loadLobby();
    });

    document.getElementById('bingoBtn').addEventListener('click', async () => {
      if (gameEnded) return;
      if (currentDerash <= 0) return showAlert('የደራሽ ሽልማት የለም።');
      if (!checkPlayerWinAndHighlight()) {
        return showAlert('ገና ሙሉ 5 በአንድ መስመር የተጠሩ ቁጥሮች አልሞሉም!');
      }

      try {
        const res = await fetch('/api/claim-win', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, reward: currentDerash })
        });
        if (res.ok) {
          const data = await res.json();
          if (typeof data.balance === 'number') setBalance(data.balance);
          else setBalance(currentBalance + currentDerash);
        } else {
          setBalance(currentBalance + currentDerash);
        }
      } catch (e) {
        setBalance(currentBalance + currentDerash);
      }

      gameEnded = true;
      stopAutoLoop();
      speak('Bingo! You win!');
      showAlert('🎉 BINGO! +' + currentDerash + ' ብር ወደ Balance ገባ!');
      currentDerash = 0;
      document.getElementById('stDerash').textContent = '0';
    });

    loadLobby();
  </script>
</body>
</html>
