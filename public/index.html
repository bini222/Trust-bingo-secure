<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Bingo - Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #e9e2f5;
      color: #1f1b2e;
      padding-bottom: 72px;
    }
    .topbar {
      background: #5c1b8a;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .pill {
      background: rgba(255,255,255,0.18);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
    }
    .container { padding: 14px; max-width: 520px; margin: 0 auto; }
    .card-box {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .stake-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .stake-btn {
      padding: 12px;
      border: 2px solid #5c1b8a;
      background: #fff;
      color: #5c1b8a;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
    .stake-btn.active { background: #5c1b8a; color: #fff; }
    .cartela-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .c-btn {
      padding: 7px 2px;
      border: 1px solid #d2c5e6;
      background: #f8f5fc;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .c-btn.selected { background: #ff7a00; color: #fff; border-color: #ff7a00; }
    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ff7a00;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .call-banner {
      background: #4b1473;
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .call-num {
      background: #ff7a00;
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bingo-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      text-align: center;
      font-weight: 700;
    }
    .bingo-table th { color: #fff; padding: 8px; font-size: 15px; }
    .bingo-table th:nth-child(1) { background: #e59a16; }
    .bingo-table th:nth-child(2) { background: #149c4b; }
    .bingo-table th:nth-child(3) { background: #1d4ed8; }
    .bingo-table th:nth-child(4) { background: #dc2626; }
    .bingo-table th:nth-child(5) { background: #6b21a8; }
    .bingo-table td {
      border: 1px solid #ddd6fe;
      padding: 10px 4px;
      background: #fafafa;
      font-size: 15px;
    }
    .bingo-table td.hit { background: #fde047; color: #111; }
    .bingo-table td.free { background: #22c55e; color: #fff; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #d8c8f0;
      border-radius: 18px;
      padding: 18px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .win-title {
      background: #ff7a00;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
    .nav-item { cursor: pointer; color: #4b5563; }
    .nav-item.active { color: #5c1b8a; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>🎯 Trust Bingo</span>
    <span class="pill" id="walletPill">Balance: ... ብር</span>
  </div>

  <div class="container">
    <!-- Lobby Screen -->
    <div id="lobbyView">
      <div class="card-box">
        <div><b>1. Stake ምረጥ (ብር)</b></div>
        <div class="stake-row">
          <button class="stake-btn active" data-stake="10">10 ብር</button>
          <button class="stake-btn" data-stake="20">20 ብር</button>
          <button class="stake-btn" data-stake="50">50 ብር</button>
        </div>
      </div>

      <div class="card-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>2. ካርቴላ ምረጥ (#1 - #300)</b>
          <span id="selectedCount" style="font-size:13px; color:#5c1b8a; font-weight:700;">0 ተመርጧል</span>
        </div>
        <div class="cartela-grid" id="cartelaGrid"></div>
      </div>

      <button class="primary-btn" id="startBtn">ጨዋታ ጀምር (Play)</button>
    </div>

    <!-- Game Screen -->
    <div id="gameView" class="hidden">
      <div class="call-banner">
        <div>
          <div style="font-size:12px; opacity:0.85;">CURRENT CALL</div>
          <div id="calledInfo" style="font-size:14px; font-weight:700;">Called: 0 / 75</div>
        </div>
        <div class="call-num" id="currentNum">-</div>
      </div>

      <div id="boardsContainer"></div>

      <button class="primary-btn" style="background:#4b5563; margin-top:8px;" id="leaveBtn">ወደ Lobby ተመለስ</button>
    </div>

    <!-- Wallet Info Screen -->
    <div id="walletView" class="hidden">
      <div class="card-box">
        <h3>💳 Wallet ዝርዝር</h3>
        <p id="walletDetail">በመጫን ላይ...</p>
        <p style="font-size:13px; color:#4b5563;">ገንዘብ ለማስገባት (Telebirr / CBE) ወይም ለማውጣት ወደ ቴሌግራም ቦቱ ሜኑ ይመለሱ።</p>
      </div>
    </div>
  </div>

  <!-- BINGO Win Modal -->
  <div class="modal" id="winModal">
    <div class="modal-card">
      <div class="win-title">BINGO!</div>
      <div id="winText" style="font-weight:800; margin-bottom:10px;"></div>
      <div id="winBoardBox"></div>
      <button class="primary-btn" style="margin-top:14px;" id="closeWinBtn">ቀጥል</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="lobbyView">🎮 Game</div>
    <div class="nav-item" data-tab="walletView">💳 Wallet</div>
    <div class="nav-item" id="closeAppBtn">❌ Close</div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const params = new URLSearchParams(window.location.search);
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id)
      || params.get('userId')
      || 'demo_user';

    let selectedStake = 10;
    let selectedCartelas = new Set();
    let drawTimer = null;

    const gridEl = document.getElementById('cartelaGrid');
    for (let i = 1; i <= 300; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'c-btn';
      btn.textContent = i;
      btn.onclick = () => {
        if (selectedCartelas.has(i)) {
          selectedCartelas.delete(i);
          btn.classList.remove('selected');
        } else {
          if (selectedCartelas.size >= 2) {
            return alert('በአንድ ዙር እስከ 2 ካርቴላዎች መምረጥ ይቻላል።');
          }
          selectedCartelas.add(i);
          btn.classList.add('selected');
        }
        document.getElementById('selectedCount').textContent = `${selectedCartelas.size} ተመርጧል`;
      };
      gridEl.appendChild(btn);
    }

    document.querySelectorAll('.stake-btn').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('.stake-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedStake = Number(btn.dataset.stake);
      };
    });

    async function refreshState() {
      const res = await fetch(`/api/state?userId=${encodeURIComponent(userId)}`);
      const data = await res.json();
      document.getElementById('walletPill').textContent = `Balance: ${Number(data.balance).toFixed(2)} ብር`;
      document.getElementById('walletDetail').innerHTML =
        `🏦 Main Wallet: <b>${Number(data.mainWallet).toFixed(2)} ብር</b><br>` +
        `🎁 Play Wallet: <b>${Number(data.playWallet).toFixed(2)} ብር</b><br>` +
        `💰 Total Balance: <b>${Number(data.balance).toFixed(2)} ብር</b>`;
    }

    function checkBoardWin(card, drawnSet) {
      for (let r = 0; r < 5; r++) {
        if (card[r].every((v) => v === 'FREE' || drawnSet.has(v))) return true;
      }
      for (let c = 0; c < 5; c++) {
        if (card.every((row) => row[c] === 'FREE' || drawnSet.has(row[c]))) return true;
      }
      if (card.every((row, i) => row[i] === 'FREE' || drawnSet.has(row[i]))) return true;
      if (card.every((row, i) => row[4 - i] === 'FREE' || drawnSet.has(row[4 - i]))) return true;
      return false;
    }

    function renderBoardHtml(board, drawnSet) {
      let html = `<div class="card-box"><b>Board Number ${board.id}</b><table class="bingo-table"><thead><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr></thead><tbody>`;
      for (let r = 0; r < 5; r++) {
        html += '<tr>';
        for (let c = 0; c < 5; c++) {
          const val = board.card[r][c];
          if (val === 'FREE') {
            html += `<td class="free">★</td>`;
          } else if (drawnSet.has(val)) {
            html += `<td class="hit">${val}</td>`;
          } else {
            html += `<td>${val}</td>`;
          }
        }
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    document.getElementById('startBtn').onclick = async () => {
      if (selectedCartelas.size === 0) {
        return alert('እባክህ ቢያንስ አንድ ካርቴላ (#1-#300) ምረጥ።');
      }

      const res = await fetch('/api/start-game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId,
          stake: selectedStake,
          cartelaIds: Array.from(selectedCartelas)
        })
      });

      const data = await res.json();
      if (!res.ok) return alert(data.error || 'ጨዋታ መጀመር አልተቻለም');

      await refreshState();
      document.getElementById('lobbyView').classList.add('hidden');
      document.getElementById('walletView').classList.add('hidden');
      document.getElementById('gameView').classList.remove('hidden');

      const drawnSet = new Set();
      let idx = 0;
      const boardsContainer = document.getElementById('boardsContainer');

      function drawStep() {
        if (idx >= data.drawOrder.length) {
          clearInterval(drawTimer);
          return;
        }
        const num = data.drawOrder[idx++];
        drawnSet.add(num);
        document.getElementById('currentNum').textContent = num;
        document.getElementById('calledInfo').textContent = `Called: ${idx} / 75`;
        boardsContainer.innerHTML = data.boards.map((b) => renderBoardHtml(b, drawnSet)).join('');

        const winnerBoard = data.boards.find((b) => checkBoardWin(b.card, drawnSet));
        if (winnerBoard) {
          clearInterval(drawTimer);
          fetch('/api/claim-win', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, reward: data.reward })
          }).then(() => refreshState());

          document.getElementById('winText').textContent = `Board #${winnerBoard.id} አሸንፏል! (+${data.reward} ብር)`;
          document.getElementById('winBoardBox').innerHTML = renderBoardHtml(winnerBoard, drawnSet);
          document.getElementById('winModal').classList.add('show');
        }
      }

      clearInterval(drawTimer);
      drawStep();
      drawTimer = setInterval(drawStep, 2500);
    };

    document.getElementById('leaveBtn').onclick = () => {
      clearInterval(drawTimer);
      document.getElementById('gameView').classList.add('hidden');
      document.getElementById('lobbyView').classList.remove('hidden');
    };

    document.getElementById('closeWinBtn').onclick = () => {
      document.getElementById('winModal').classList.remove('show');
      document.getElementById('gameView').classList.add('hidden');
      document.getElementById('lobbyView').classList.remove('hidden');
    };

    document.querySelectorAll('.nav-item[data-tab]').forEach((item) => {
      item.onclick = () => {
        document.querySelectorAll('.nav-item[data-tab]').forEach((n) => n.classList.remove('active'));
        item.classList.add('active');
        const target = item.dataset.tab;
        ['lobbyView', 'gameView', 'walletView'].forEach((id) => {
          document.getElementById(id).classList.toggle('hidden', id !== target);
        });
        refreshState();
      };
    });

    document.getElementById('closeAppBtn').onclick = () => {
      clearInterval(drawTimer);
      if (tg) tg.close();
    };

    refreshState();
  </script>
</body>
</html>
