<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Bingo - Final Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #100c20; color: #f5f2ff; padding-bottom: 78px; }
    .topbar {
      background: linear-gradient(90deg, #4c1475, #7e22ce, #c026d3);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    }
    .top-right { display: flex; gap: 8px; align-items: center; }
    .pill {
      background: rgba(255,255,255,0.16); padding: 6px 12px;
      border-radius: 999px; font-size: 12px; font-weight: 800;
    }
    .icon-btn {
      background: rgba(255,255,255,0.16); border: none; color: #fff;
      padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .container { padding: 14px; max-width: 540px; margin: 0 auto; }
    .card {
      background: #1c1633; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 14px; margin-bottom: 14px;
    }
    .section-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 10px; }
    .stakes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stake-btn {
      padding: 12px 8px; border-radius: 12px; border: 1px solid #6d28d9;
      background: #281f47; color: #fff; font-weight: 800; cursor: pointer;
    }
    .stake-btn.active { background: #f59e0b; border-color: #f59e0b; color: #100c20; }
    .meta-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; font-weight: 700; color: #ddd6fe; }
    .timer-banner {
      background: linear-gradient(90deg, #2a134e, #431870);
      border: 1px solid #a855f7; border-radius: 14px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .timer-num { font-size: 22px; font-weight: 900; color: #fbbf24; }
    .grid-300 {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
      max-height: 225px; overflow-y: auto; padding: 6px; background: #140f26; border-radius: 12px;
    }
    .num-btn {
      padding: 7px 2px; border: 1px solid #352863; border-radius: 7px;
      background: #241b42; color: #ede9fe; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .num-btn.mine { background: #16a34a; color: #fff; border-color: #16a34a; }
    .num-btn.ai { background: #7c3aed; color: #fff; border-color: #7c3aed; cursor: not-allowed; }
    .num-btn.taken { background: #47405e; color: #aaa; cursor: not-allowed; }
    .play-btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(90deg, #f59e0b, #ea580c);
      color: #fff; font-size: 16px; font-weight: 900; cursor: pointer;
    }
    .ai-status {
      background: #1b1433; border: 1px solid #5b21b6;
      padding: 10px 12px; border-radius: 12px; font-size: 13px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .ai-alert { color: #f87171; font-weight: 900; }
    .caller-card {
      background: linear-gradient(145deg, #241947, #16102b);
      border: 1px solid #7e22ce; border-radius: 16px; padding: 14px;
      text-align: center; margin-bottom: 12px;
    }
    .letter-pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
    .lp { padding: 5px 0; border-radius: 8px; font-weight: 900; font-size: 13px; background: #2c2152; color: #c4b5fd; }
    .lp.active-B { background: #2563eb; color: #fff; }
    .lp.active-I { background: #dc2626; color: #fff; }
    .lp.active-N { background: #16a34a; color: #fff; }
    .lp.active-G { background: #d97706; color: #fff; }
    .lp.active-O { background: #db2777; color: #fff; }
    .called-big { font-size: 40px; font-weight: 900; color: #fbbf24; margin: 4px 0; }
    .history-strip { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .hist-chip { background: #31255c; padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #ede9fe; }
    .board-box {
      background: #1c1633; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 10px; margin-bottom: 12px;
    }
    .board-title { font-weight: 800; margin-bottom: 8px; color: #d8b4fe; display: flex; justify-content: space-between; }
    .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 9px; background: #2a204d; font-weight: 800; font-size: 14px;
      border: 1px solid #433378; cursor: pointer; user-select: none;
    }
    .cell.called-hint { border-color: #fbbf24; box-shadow: inset 0 0 0 1px #fbbf24; }
    .cell.marked { background: #f59e0b; color: #100c20; border-color: #f59e0b; }
    .cell.free { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .sec-btn {
      flex: 1; padding: 11px 8px; border: none; border-radius: 11px;
      background: #3b2a70; color: #fff; font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .win-btn {
      flex: 1; padding: 11px 8px; border: none; border-radius: 11px;
      background: #16a34a; color: #fff; font-weight: 900; font-size: 13px; cursor: pointer;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #17112b;
      border-top: 1px solid #32255e; display: flex; justify-content: space-around; padding: 10px 0;
    }
    .nav-btn { background: none; border: none; font-weight: 800; color: #ddd6fe; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>🏆 Trust Bingo</span>
    <div class="top-right">
      <button class="icon-btn" id="soundBtn">🔊 ON</button>
      <span class="pill" id="balPill">0.00 ብር</span>
    </div>
  </div>

  <div class="container">
    <div id="lobbyView">
      <div class="timer-banner">
        <div>
          <div style="font-size:13px;font-weight:800;">Match Countdown</div>
          <div style="font-size:12px;color:#c4b5fd;">ካርቴላ ስትይዝ 10s ይቆጠራል • Solo vs AI</div>
        </div>
        <div class="timer-num" id="countdownDisplay">10s</div>
      </div>

      <div class="card">
        <div class="section-head"><span>1. Stake ምረጥ</span></div>
        <div class="stakes">
          <button class="stake-btn active" data-stake="10">10 ብር</button>
          <button class="stake-btn" data-stake="20">20 ብር</button>
          <button class="stake-btn" data-stake="50">50 ብር</button>
        </div>
        <div class="meta-row">
          <span id="stakeLabel">ወጪ፦ 10 ብር</span>
          <span id="derashLabel">ደራሽ፦ 0 ብር</span>
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <span>2. ካርቴላ (#1 - #300)</span>
          <span id="pickedCount">0 ተመርጧል</span>
        </div>
        <div class="grid-300" id="cartelaGrid"></div>
      </div>

      <button class="play-btn" id="startGameBtn">አሁን ጀምር (Play vs AI)</button>
    </div>

    <div id="gameView" style="display:none;">
      <div class="ai-status">
        <span>🤖 <b>AI Rival</b> (#<span id="aiCartelaId">-</span>)</span>
        <span id="aiProgressText">Progress: 1/5</span>
      </div>

      <div class="caller-card">
        <div class="letter-pills">
          <span class="lp" id="lp-B">B</span>
          <span class="lp" id="lp-I">I</span>
          <span class="lp" id="lp-N">N</span>
          <span class="lp" id="lp-G">G</span>
          <span class="lp" id="lp-O">O</span>
        </div>
        <div class="called-big" id="calledNum">READY</div>
        <div style="font-size:12px;color:#c4b5fd;">ጥሪ፦ <span id="drawIndex">0</span>/75 • ደራሽ፦ <b id="gameDerashText">0 ብር</b></div>
        <div class="history-strip" id="historyStrip"></div>
        <div class="btn-row">
          <button class="sec-btn" id="nextBallBtn">ቀጣይ ጥሪ</button>
          <button class="sec-btn" id="autoCallBtn">Auto: OFF</button>
          <button class="win-btn" id="bingoBtn">BINGO!</button>
        </div>
      </div>

      <div id="boardsContainer"></div>
      <button class="sec-btn" style="width:100%;" id="backLobbyBtn">ወደ ሎቢ ተመለስ</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="navGame">🎮 Game</button>
    <button class="nav-btn" id="navClose">✖ Close</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(window.location.search);
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    const userId = String(tgUser || params.get('userId') || 'guest');

    let currentStake = 10;
    let myCartelas = [];
    let aiCartelaId = null;
    let aiCard = null;
    let aiMarked = new Set(['FREE']);
    let takenCartelas = [];

    let drawOrder = [];
    let calledSet = new Set();
    let drawPos = 0;
    let callHistory = [];
    let currentDerash = 0;
    let activeBoards = [];
    let gameFinished = false;
    let soundEnabled = true;

    let countdownSec = 10;
    let countdownInterval = null;
    let autoCallTimer = null;
    let autoCallEnabled = false;

    function showAlert(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    function updateBalanceText(val) {
      document.getElementById('balPill').textContent = Number(val || 0).toFixed(2) + ' ብር';
    }

    function getBingoLetter(num) {
      if (num <= 15) return 'B';
      if (num <= 30) return 'I';
      if (num <= 45) return 'N';
      if (num <= 60) return 'G';
      return 'O';
    }

    function speakCall(text) {
      if (!soundEnabled) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1.05;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    function highlightLetter(letter) {
      ['B', 'I', 'N', 'G', 'O'].forEach((l) => {
        const el = document.getElementById('lp-' + l);
        el.className = 'lp' + (l === letter ? ' active-' + l : '');
      });
    }

    function stopCountdown() {
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    }

    function startCountdown() {
      stopCountdown();
      countdownSec = 10;
      document.getElementById('countdownDisplay').textContent = countdownSec + 's';
      countdownInterval = setInterval(async () => {
        if (myCartelas.length === 0) {
          countdownSec = 10;
          document.getElementById('countdownDisplay').textContent = '10s';
          return;
        }
        countdownSec -= 1;
        document.getElementById('countdownDisplay').textContent = Math.max(0, countdownSec) + 's';
        if (countdownSec <= 0) {
          stopCountdown();
          await startMatch();
        }
      }, 1000);
    }

    function stopAutoCall() {
      autoCallEnabled = false;
      document.getElementById('autoCallBtn').textContent = 'Auto: OFF';
      if (autoCallTimer) { clearInterval(autoCallTimer); autoCallTimer = null; }
    }

    function buildLocalCartela(id) {
      const ranges = [[1, 15], [16, 30], [31, 45], [46, 60], [61, 75]];
      let s = (id * 7919 + 104729) % 2147483647;
      const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      const cols = ranges.map(([lo, hi]) => {
        const arr = [];
        for (let n = lo; n <= hi; n++) arr.push(n);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.slice(0, 5);
      });
      const card = [];
      for (let r = 0; r < 5; r++) {
        const row = [];
        for (let c = 0; c < 5; c++) row.push(r === 2 && c === 2 ? 'FREE' : cols[c][r]);
        card.push(row);
      }
      return card;
    }

    function hasWinningLine(card, markedSet) {
      for (let r = 0; r < 5; r++) {
        if ([0, 1, 2, 3, 4].every((c) => markedSet.has(String(card[r][c])))) return true;
      }
      for (let c = 0; c < 5; c++) {
        if ([0, 1, 2, 3, 4].every((r) => markedSet.has(String(card[r][c])))) return true;
      }
      if ([0, 1, 2, 3, 4].every((i) => markedSet.has(String(card[i][i])))) return true;
      if ([0, 1, 2, 3, 4].every((i) => markedSet.has(String(card[i][4 - i])))) return true;
      return false;
    }

    function verifyPlayerBingo() {
      return activeBoards.some((b) => {
        const card = b.card || [];
        const marked = new Set(['FREE']);
        const cells = b._cells || [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const val = card[r][c];
            if (val === 'FREE') continue;
            const cellEl = cells[r * 5 + c];
            if (cellEl && cellEl.classList.contains('marked') && calledSet.has(Number(val))) {
              marked.add(String(val));
            }
          }
        }
        return hasWinningLine(card, marked);
      });
    }

    function updateAiProgress(num) {
      if (!aiCard || gameFinished) return;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (aiCard[r][c] === num) aiMarked.add(String(num));
        }
      }
      let best = 0;
      for (let r = 0; r < 5; r++) {
        const cnt = [0, 1, 2, 3, 4].filter((c) => aiMarked.has(String(aiCard[r][c]))).length;
        if (cnt > best) best = cnt;
      }
      for (let c = 0; c < 5; c++) {
        const cnt = [0, 1, 2, 3, 4].filter((r) => aiMarked.has(String(aiCard[r][c]))).length;
        if (cnt > best) best = cnt;
      }
      const progEl = document.getElementById('aiProgressText');
      if (best === 4) {
        progEl.innerHTML = '<span class="ai-alert">1 AWAY! 🔥</span>';
      } else {
        progEl.textContent = 'Progress: ' + best + '/5';
      }

      if (hasWinningLine(aiCard, aiMarked)) {
        gameFinished = true;
        stopAutoCall();
        speakCall('AI wins Bingo');
        showAlert('🤖 AI BINGO! በዚህ ዙር AI ቀድሞ ቢንጎ አሸነፈ። እንደገና ሞክር!');
      }
    }

    async function loadState() {
      const res = await fetch('/api/state?userId=' + encodeURIComponent(userId) + '&stake=' + currentStake);
      const data = await res.json();
      updateBalanceText(data.balance);
      takenCartelas = (data.room && data.room.takenCartelas) || [];
      const derash = (data.room && data.room.derash) || 0;
      document.getElementById('stakeLabel').textContent = 'ወጪ፦ ' + currentStake + ' ብር';
      document.getElementById('derashLabel').textContent = 'ደራሽ፦ ' + derash + ' ብር';
      document.getElementById('pickedCount').textContent = myCartelas.length + ' ተመርጧል';
      renderCartelaGrid();
    }

    function renderCartelaGrid() {
      const grid = document.getElementById('cartelaGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 300; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = i;
        if (myCartelas.includes(i)) {
          btn.classList.add('mine');
        } else if (i === aiCartelaId) {
          btn.classList.add('ai');
          btn.disabled = true;
        } else if (takenCartelas.includes(i)) {
          btn.classList.add('taken');
          btn.disabled = true;
        }
        btn.addEventListener('click', () => onTakeCartela(i));
        grid.appendChild(btn);
      }
    }

    async function onTakeCartela(cartelaId) {
      if (myCartelas.includes(cartelaId)) return;
      const res = await fetch('/api/take-cartela', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, stake: currentStake, cartelaId })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error || 'ካርቴላ መያዝ አልተቻለም');

      myCartelas.push(cartelaId);
      if (!aiCartelaId) {
        let candidate = ((cartelaId * 43 + 17) % 300) + 1;
        if (myCartelas.includes(candidate)) candidate = (candidate % 300) + 1;
        aiCartelaId = candidate;
      }
      updateBalanceText(data.balance);
      takenCartelas = (data.room && data.room.takenCartelas) || takenCartelas;
      const derash = (data.room && data.room.derash) || 0;
      document.getElementById('derashLabel').textContent = 'ደራሽ፦ ' + derash + ' ብር';
      document.getElementById('pickedCount').textContent = myCartelas.length + ' ተመርጧል';
      renderCartelaGrid();
      startCountdown();
    }

    async function startMatch() {
      if (myCartelas.length === 0) return showAlert('መጀመሪያ ቢያንስ አንድ ካርቴላ ያዝ።');
      stopCountdown();
      const res = await fetch('/api/start-game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, stake: currentStake, cartelaIds: myCartelas })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error || 'ጨዋታ መጀመር አልተቻለም');

      drawOrder = data.drawOrder || [];
      calledSet = new Set();
      drawPos = 0;
      callHistory = [];
      gameFinished = false;
      currentDerash = data.derash || 0;
      activeBoards = data.boards || [];
      myCartelas = [];

      const chosenAiId = aiCartelaId || 88;
      aiCard = buildLocalCartela(chosenAiId);
      aiMarked = new Set(['FREE']);
      document.getElementById('aiCartelaId').textContent = chosenAiId;
      document.getElementById('aiProgressText').textContent = 'Progress: 1/5';

      highlightLetter('');
      document.getElementById('gameDerashText').textContent = currentDerash + ' ብር';
      document.getElementById('calledNum').textContent = 'READY';
      document.getElementById('drawIndex').textContent = '0';
      document.getElementById('historyStrip').innerHTML = '';
      renderBoards();

      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').style.display = 'block';
    }

    function refreshBoardHints(num) {
      activeBoards.forEach((b) => {
        (b._cells || []).forEach((cell) => {
          if (Number(cell.dataset.val) === num) {
            cell.classList.add('called-hint');
          }
        });
      });
    }

    function callNextBall() {
      if (gameFinished) return;
      if (drawPos >= drawOrder.length) {
        stopAutoCall();
        return showAlert('ሁሉም 75 ቁጥሮች ተጠርተዋል።');
      }
      const num = drawOrder[drawPos++];
      calledSet.add(num);
      const letter = getBingoLetter(num);
      const label = letter + '-' + num;
      callHistory.unshift(label);
      if (callHistory.length > 6) callHistory.pop();

      highlightLetter(letter);
      document.getElementById('calledNum').textContent = label;
      document.getElementById('drawIndex').textContent = String(drawPos);
      document.getElementById('historyStrip').innerHTML = callHistory
        .map((item) => '<span class="hist-chip">' + item + '</span>')
        .join('');

      refreshBoardHints(num);
      speakCall(letter + ' ' + num);
      updateAiProgress(num);
    }

    function renderBoards() {
      const container = document.getElementById('boardsContainer');
      container.innerHTML = '';
      activeBoards.forEach((b) => {
        const box = document.createElement('div');
        box.className = 'board-box';
        box.innerHTML =
          '<div class="board-title"><span>Cartela #' + b.id + '</span><span>5 in a Row = BINGO</span></div>' +
          '<div class="letter-pills"><span class="lp">B</span><span class="lp">I</span><span class="lp">N</span><span class="lp">G</span><span class="lp">O</span></div>';

        const grid = document.createElement('div');
        grid.className = 'bingo-grid';
        b._cells = [];

        (b.card || []).forEach((row) => {
          row.forEach((val) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.val = String(val);
            cell.textContent = val;
            if (val === 'FREE') {
              cell.classList.add('free', 'marked');
            } else {
              cell.addEventListener('click', () => {
                if (!calledSet.has(Number(val))) {
                  return showAlert('ቁጥር ' + val + ' ገና አልተጠራም!');
                }
                cell.classList.toggle('marked');
              });
            }
            b._cells.push(cell);
            grid.appendChild(cell);
          });
        });

        box.appendChild(grid);
        container.appendChild(box);
      });
    }

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    });

    document.querySelectorAll('.stake-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (myCartelas.length > 0) return showAlert('በዚህ ዙር የተያዘ ካርቴላ አለህ።');
        document.querySelectorAll('.stake-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentStake = Number(btn.dataset.stake);
        await loadState();
      });
    });

    document.getElementById('startGameBtn').addEventListener('click', startMatch);
    document.getElementById('nextBallBtn').addEventListener('click', callNextBall);

    document.getElementById('autoCallBtn').addEventListener('click', () => {
      if (autoCallEnabled) {
        stopAutoCall();
      } else {
        autoCallEnabled = true;
        document.getElementById('autoCallBtn').textContent = 'Auto: ON';
        callNextBall();
        autoCallTimer = setInterval(() => {
          if (gameFinished || drawPos >= drawOrder.length) stopAutoCall();
          else callNextBall();
        }, 2400);
      }
    });

    document.getElementById('bingoBtn').addEventListener('click', async () => {
      if (gameFinished) return;
      if (currentDerash <= 0) return showAlert('የደራሽ ሽልማት የለም።');
      if (!verifyPlayerBingo()) {
        return showAlert('ገና ሙሉ 5 በአንድ መስመር (Row / Column / Diagonal) የተጠሩ ቁጥሮች አልሞሉም!');
      }

      const res = await fetch('/api/claim-win', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, reward: currentDerash })
      });
      const data = await res.json();
      if (res.ok) {
        gameFinished = true;
        stopAutoCall();
        updateBalanceText(data.balance);
        speakCall('Bingo! You win!');
        showAlert('🎉 BINGO! +' + currentDerash + ' ብር ወደ Main Wallet ገባ!');
        currentDerash = 0;
        document.getElementById('gameDerashText').textContent = '0 ብር';
      }
    });

    document.getElementById('backLobbyBtn').addEventListener('click', async () => {
      stopAutoCall();
      stopCountdown();
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'block';
      await loadState();
    });

    document.getElementById('navGame').addEventListener('click', () => {
      stopAutoCall();
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'block';
      loadState();
    });

    document.getElementById('navClose').addEventListener('click', () => {
      if (tg && tg.close) tg.close();
    });

    loadState();
  </script>
</body>
</html>
